[project]
name = "travel-planner"
version = "1.0.0"
description = "智能旅行规划助手：一句话输入，三 Agent 协作输出结构完整、预算可控的行程单"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.scripts]
travel-planner = "travel_planner.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
